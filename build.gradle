plugins {
    id 'java'
    id 'application'
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

test {
    useJUnitPlatform()
}

application {
    // Вказуємо головний клас твоєї програми
    mainClass = 'ua.delivery.Main'
}

// Примусове використання UTF-8 під час компіляції
tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

// Примусове використання UTF-8 під час виконання програми в консолі
tasks.withType(JavaExec) {
    jvmArgs += [
        "-Dfile.encoding=UTF-8",
        "-Dsun.stdout.encoding=UTF-8",
        "-Dsun.stderr.encoding=UTF-8"
    ]
}